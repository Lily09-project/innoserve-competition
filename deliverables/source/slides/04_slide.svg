<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft JhengHei"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="57" font-size="16" fill="#0070D1" font-weight="600" text-anchor="start">EVIDENCE</text><text x="64" y="120" font-size="44" fill="#000000" font-weight="300" text-anchor="start">創新二：用任務證據完成稽核</text><image x="60" y="182" width="250" height="250" href="../icon-3.png" preserveAspectRatio="xMidYMid meet"/><rect x="350" y="183" width="866" height="95" rx="8" fill="#F5F7FA" stroke="none"/><text x="374" y="216" font-size="28" fill="#000000" font-weight="400" text-anchor="start">512＋17 → 529 維</text><text x="374" y="254" font-size="22" fill="#6B6B6B" font-weight="400" text-anchor="start">流量表徵＋類別機率，建立任務向量</text><rect x="350" y="299" width="866" height="95" rx="8" fill="#F5F7FA" stroke="none"/><text x="374" y="332" font-size="28" fill="#000000" font-weight="400" text-anchor="start">Top-5 訓練案例</text><text x="374" y="370" font-size="22" fill="#6B6B6B" font-weight="400" text-anchor="start">只檢索訓練庫；保留相似案例與類別共識</text><rect x="350" y="415" width="866" height="95" rx="8" fill="#F5F7FA" stroke="none"/><text x="374" y="448" font-size="28" fill="#000000" font-weight="400" text-anchor="start">本機 AI 證據稽核</text><text x="374" y="486" font-size="22" fill="#6B6B6B" font-weight="400" text-anchor="start">支持、複核、不確定；保留正式分類</text><text x="64" y="620" font-size="26" fill="#000000" font-weight="400" text-anchor="start">同一事件識別碼貫穿判定、案例、稽核與回條。</text><text x="64" y="687" font-size="14" fill="#6B6B6B" font-weight="400" text-anchor="start">AI 資安框架 · 資安技術組</text><text x="1216" y="687" font-size="14" fill="#6B6B6B" font-weight="400" text-anchor="end">04 / 08</text></svg>