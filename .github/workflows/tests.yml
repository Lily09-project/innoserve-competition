name: Public quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    name: Python contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
  quality:
    name: Lint and public audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.14.2
      - run: python -m ruff check scripts/validate_results.py scripts/check_public_files.py scripts/check_delivery_docs.py scripts/audit_final_chain.py tests/test_public_results.py --select E9,F63,F7,F82
      - run: python scripts/check_public_files.py
  frontend:
    name: Frontend smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:media
      - run: pnpm run check:media
