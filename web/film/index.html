<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>45秒看懂 AI 資安框架</title>
    <style>
      :root {
        font-family: "Microsoft JhengHei", system-ui, sans-serif;
        color: #192b46;
        background: #f4f7fb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 1120px;
        margin: auto;
        padding: 32px 24px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: clamp(24px, 4vw, 36px);
        margin: 8px 0;
      }
      p {
        color: #5d6c80;
        line-height: 1.8;
      }
      a {
        color: #1558d6;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.12em;
        font-weight: 700;
        color: #1558d6;
      }
      video {
        display: block;
        width: 100%;
        aspect-ratio: 16/9;
        background: #eef3f9;
        border: 1px solid #dce4ef;
        border-radius: 16px;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        margin: 20px 0;
      }
      button,
      select,
      .download {
        font: inherit;
        border: 1px solid #c7d4e5;
        background: white;
        color: #192b46;
        border-radius: 8px;
        padding: 10px 14px;
        min-height: 44px;
        cursor: pointer;
      }
      button:hover {
        background: #edf3ff;
      }
      button:focus-visible,
      a:focus-visible,
      select:focus-visible {
        outline: 3px solid #1558d6;
        outline-offset: 3px;
      }
      .chapters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chapters button {
        font-size: 14px;
      }
      .note {
        border-top: 1px solid #dce4ef;
        padding-top: 18px;
        font-size: 14px;
      }
      .status {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }
      @media (max-width: 640px) {
        main {
          padding: 20px 14px;
        }
        header {
          display: block;
        }
        .status {
          margin-left: 0;
        }
        video {
          border-radius: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <span class="eyebrow">AI SECURITY FRAMEWORK · QUICK TOUR</span>
          <h1>45 秒看懂，從偵測到回復</h1>
          <p>新版封包任務動畫 · 原90秒影片加速2倍 · 無語音、附音效</p>
        </div>
        <a href="../index.html">← 回事件工作台</a>
      </header>
      <video
        id="product-video"
        controls
        playsinline
        preload="none"
        poster="media/poster.jpg"
        aria-label="45秒產品方法動畫"
      >
        <source src="media/product-45s.mp4" type="video/mp4" />
        <track
          kind="captions"
          srclang="zh-Hant"
          label="繁體中文"
          src="media/captions.vtt"
        />
        瀏覽器不支援播放，請下載影片觀看。
      </video>
      <div class="controls">
        <label for="video-speed">播放速度</label
        ><select id="video-speed">
          <option value="1">標準快版 · 45秒</option>
          <option value="1.5">1.5× · 約30秒</option>
          <option value="2">2× · 約23秒</option></select
        ><button id="restart-video">從頭播放</button
        ><a
          class="download"
          href="media/product-45s.mp4"
          download="AI資安框架_45秒快版.mp4"
          >下載45秒影片</a
        ><output id="video-status" class="status" aria-live="polite"
          >點擊播放開始</output
        >
      </div>
      <nav class="chapters" aria-label="跳至方法段落">
        <button data-time="0">封包進場</button
        ><button data-time="8">雙分支偵測</button
        ><button data-time="12">任務向量</button
        ><button data-time="16.5">Top-5證據</button
        ><button data-time="21">AI稽核</button
        ><button data-time="26">策略檢核</button
        ><button data-time="31">隔離驗證</button
        ><button data-time="36">到期回復</button
        ><button data-time="41">實測成果</button>
      </nav>
      <p class="note">
        拓樸與封包為方法示意，非 Packet Tracer
        錄製。影片呈現既有實測彙整；網站工作台另採合成資料展示。隔離網路的合成TCP交易驗證與真實攻擊防禦率分開解讀。圖中文字可暫停閱讀，實際規則有效期為30秒。
      </p>
    </main>
    <script src="fast-player.js" defer></script>
  </body>
</html>
