<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f8fc">
<title>AI 資安框架｜系統展示影片</title>
<style>
:root{color-scheme:light;--bg:#f5f8fc;--panel:#ffffff;--line:#dce3ee;--ink:#0b1b33;--muted:#5b6b82;--cyan:#1d4ed8;--blue:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;min-height:100vh}
header,main{max-width:1360px;margin:auto;padding:22px 28px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
a{color:var(--cyan);text-decoration:none}
.kicker{font:700 11px/1.6 "Segoe UI",Arial,sans-serif;letter-spacing:.16em;color:var(--cyan);margin:0}
h1{font-size:20px;margin:4px 0 2px}
header p.meta{font-size:13px;color:var(--muted);margin:0}
.screen{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 20px 50px -30px rgba(11,27,51,.35)}
.screen svg{display:block;width:100%;height:100%}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 14px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
button,select{background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:44px;cursor:pointer;color:var(--ink);font:inherit}
button:hover,select:hover{border-color:#9fb2d3}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
#play{background:linear-gradient(90deg,var(--cyan),var(--blue));color:#fff;border:0;font-weight:700;min-width:116px}
select{background:var(--panel)}
label{font-size:13px;color:var(--muted)}
input{flex:1;min-width:100px;accent-color:var(--cyan)}
output{font:13px "Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums;min-width:110px;color:var(--muted)}
.chapters{display:flex;gap:8px;flex-wrap:wrap}
.chapters button{font-size:13px;min-height:38px;color:var(--muted)}
.chapters button[aria-current=true]{background:#eaf0fe;border-color:var(--cyan);color:var(--ink);font-weight:700}
.caption{font-size:13px;color:var(--muted)}
body.fullscreen header,body.fullscreen .controls,body.fullscreen .chapters,body.fullscreen .caption{display:none}
body.fullscreen main{max-width:none;padding:0;display:grid;place-items:center;min-height:100vh;background:#fff}
body.fullscreen .screen{width:min(100vw,177.7778vh);border:0;border-radius:0}
@media(max-width:640px){header,main{padding:14px}header{display:block}header a{display:inline-block;margin-top:10px}.controls{gap:8px}.controls button,.controls select{font-size:12px;padding:8px}h1{font-size:16px}}
</style>
</head>
<body>
<header>
  <div>
    <p class="kicker">AI SECURITY FRAMEWORK · SYSTEM DEMO</p>
    <h1>融合新型內容相依時序方向模型入侵偵測與任務導向檢索增強稽核之 AI 資安框架</h1>
    <p class="meta">系統展示影片 · 01:00 · 可暫停、跳章與全螢幕</p>
  </div>
  <a href="../index.html">← 回事件工作台</a>
</header>
<main>
  <div class="screen" id="screen" role="img" aria-label="以輸入、處理與輸出三欄呈現一筆事件的完整處理流程"></div>
  <div class="controls">
    <button id="play">播放動畫</button>
    <button id="restart">重新播放</button>
    <label for="seek">進度</label>
    <input id="seek" type="range" min="0" max="60" step="0.1" value="0">
    <output id="clock">00:00 / 01:00</output>
    <label for="speed">速度</label>
    <select id="speed"><option value="1">1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
    <button id="fullscreen">全螢幕</button>
  </div>
  <div class="chapters" id="chapters"></div>
  <p class="caption">每個段落依序呈現該階段的輸入資料、處理步驟與輸出結果；成果數字取自 18,998 筆偵測測試、463 筆整合查詢與 Mininet 隔離網路實測。</p>
  <p class="caption" id="scene-status" role="status"></p>
</main>
<script type="module" src="player.mjs"></script>
</body>
</html>
